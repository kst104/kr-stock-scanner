services:
  - type: web
    name: kr-stock-scanner
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
  - type: web
    name: kr-market-trend
    runtime: node
    plan: free
    branch: claude/market-trend-8-stocks-hpsfn5
    buildCommand: ""
    startCommand: npm run trend
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
